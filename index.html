<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vernier — biblioteca de componentes</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vernier-theme')
          var theme = t === 'light' ? 'light' : 'dark'
          document.documentElement.classList.remove('dark', 'light')
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
        try {
          var fonts = {
            vernier: {
              display: '"Fraunces", Georgia, serif',
              sans: '"General Sans", "Segoe UI", system-ui, sans-serif',
            },
            inter: {
              display: '"Inter", "Segoe UI", system-ui, sans-serif',
              sans: '"Inter", "Segoe UI", system-ui, sans-serif',
            },
            manrope: {
              display: '"Manrope", "Segoe UI", system-ui, sans-serif',
              sans: '"Manrope", "Segoe UI", system-ui, sans-serif',
            },
            geist: {
              display: '"Geist Sans", "Segoe UI", system-ui, sans-serif',
              sans: '"Geist Sans", "Segoe UI", system-ui, sans-serif',
            },
            'plus-jakarta': {
              display: '"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif',
              sans: '"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif',
            },
            'general-sans': {
              display: '"General Sans", "Segoe UI", system-ui, sans-serif',
              sans: '"General Sans", "Segoe UI", system-ui, sans-serif',
            },
            satoshi: {
              display: '"Satoshi", "Segoe UI", system-ui, sans-serif',
              sans: '"Satoshi", "Segoe UI", system-ui, sans-serif',
            },
            playfair: {
              display: '"Playfair Display", Georgia, serif',
              sans: '"Inter", "Segoe UI", system-ui, sans-serif',
            },
            'instrument-serif': {
              display: '"Instrument Serif", Georgia, serif',
              sans: '"Manrope", "Segoe UI", system-ui, sans-serif',
            },
            newsreader: {
              display: '"Newsreader", Georgia, serif',
              sans: '"Inter", "Segoe UI", system-ui, sans-serif',
            },
            lora: {
              display: '"Lora", Georgia, serif',
              sans: '"Inter", "Segoe UI", system-ui, sans-serif',
            },
            'dm-serif': {
              display: '"DM Serif Display", Georgia, serif',
              sans: '"Manrope", "Segoe UI", system-ui, sans-serif',
            },
            cormorant: {
              display: '"Cormorant Garamond", Georgia, serif',
              sans: '"Inter", "Segoe UI", system-ui, sans-serif',
            },
          }
          var fid = localStorage.getItem('vernier-font')
          var preset = fonts[fid] || fonts.vernier
          var root = document.documentElement
          root.style.setProperty('--font-display', preset.display)
          root.style.setProperty('--font-sans', preset.sans)
          if (fid && fonts[fid]) root.dataset.font = fid
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Serif+Display:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Instrument+Serif:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Newsreader:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,401,500,501,600,700&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/400.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/500.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/600.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.3.0/700.css"
    />
  </head>
  <body class="bg-ink text-vellum font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
